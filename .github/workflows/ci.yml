on:
  # Those checks only run against code changes
  - push

name: Continuous integration

permissions: {}

env:
  MSRV: 1.95.0
  CARGO_TERM_COLOR: always
  # Useful for cargo insta
  CI: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Rustup
        run: rustup default stable
      - run: cargo check --locked

  test_features_matrix:
    name: Cargo test
    strategy:
      matrix:
        args:
        - ""
        - "--all-features"
        - "--features from-directory"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Install libsqlite
        run: sudo apt-get install -y libsqlite3-dev
      - name: Rustup
        run: rustup default stable
      - name: Cargo test
        run: cargo test --locked ${{ matrix.args }}

  min_rust_version:
    name: Check with minimal Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Install libsqlite
        run: sudo apt-get install -y libsqlite3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Rustup (minimal)
        run: rustup set profile minimal && rustup default ${{ env.MSRV }}
      - name: Cargo test
        run: cargo test --locked

  doc:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Rustup
        run: rustup default stable
      - run: RUSTDOCFLAGS="-D warnings" cargo --locked doc --all-features --no-deps --lib

  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Rustup
        run: rustup default stable
      - run: rustup component add rustfmt
      - name: Cargo fmt
        run: cargo fmt --all -- --check

  mutation-tests:
    name: Mutation tests
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v3
      - name: Install libsqlite
        run: sudo apt-get install -y libsqlite3-dev
      - name: Rustup
        run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-mutants
      - name: Cargo mutants
        run: cargo mutants -p rusqlite_migration --colors=always --no-shuffle -vV --shard ${{ matrix.shard }}/4
      - name: Archive results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mutation-report
          path: mutants.out

  clippy_all:
    name: Clippy (all code)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Rustup
        run: rustup default stable
      - run: rustup component add clippy
      - name: Clippy
        run: cargo clippy --locked --all-features -- -D warnings

  clippy_main:
    name: Clippy (main package)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
      - name: Rustup
        run: rustup default stable
      - run: rustup component add clippy
      - name: Clippy
        # More stringent requirements
        run: cargo clippy --locked --all-features -p rusqlite_migration -- -D warnings -D clippy::missing_errors_doc -D clippy::missing_panics_doc -D clippy::doc_link_with_quotes -D clippy::doc_markdown

  coverage:
    name: Code coverage
    runs-on: ubuntu-24.04
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      - name: Install libsqlite
        run: sudo apt-get install -y libsqlite3-dev
      - name: Rustup
        run: rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-tarpaulin
      - name: Generate code coverage
        run: cargo tarpaulin --locked --all-features --run-types AllTargets --workspace -e rusqlite_migration_benches --timeout 120 --out Lcov
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: lcov.info
